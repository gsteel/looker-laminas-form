name: "Continuous Integration"

permissions:
  contents: read
  security-events: write
  checks: write

on:
  pull_request:
  push:
    branches:
    tags:

env:
  php_extensions: bcmath,ctype,intl,json,libxml,mbstring
  default_php: 8.4

jobs:
  ci:
    uses: laminas/workflow-continuous-integration/.github/workflows/continuous-integration.yml@1.x

  composer-require-checker:
    name: "Check for missing dependencies"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
      - uses: shivammathur/setup-php@2.37.1

        with:
          php-version: ${{ env.default_php }}
          ini-values: memory_limit=-1
          extensions: ${{ env.php_extensions }}
      - uses: ramsey/composer-install@4.0.0
      - run: make require-checker-ci

  composer-unused:
    name: Check for Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ env.default_php }}
          extensions: ${{ env.php_extensions }}
          tools: composer
      - uses: ramsey/composer-install@4.0.0
      - run: make unused-ci

  psalm-security-report:
    name: "Psalm Security Report"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ env.default_php }}
          extensions: ${{ env.php_extensions }}
      - uses: ramsey/composer-install@4.0.0
      - name: "Psalm"
        run: vendor/bin/psalm --report=results.sarif
      - name: "Upload Security Analysis results to GitHub"
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  rector:
    name: Rector on Default PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ env.default_php }}
          extensions: ${{ env.php_extensions }}
          tools: composer
      - uses: ramsey/composer-install@4.0.0
      - run: make rector-ci

  infection:
    name: Mutation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ env.default_php }}
          extensions: ${{ env.php_extensions }}
          tools: composer
      - uses: ramsey/composer-install@4.0.0
      - run: make infection-ci
